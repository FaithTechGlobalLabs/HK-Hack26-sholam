name: Shalom
options:
  bundleIdPrefix: com.owenisas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: NO
    CURRENT_PROJECT_VERSION: "4"
    MARKETING_VERSION: "0.1.3"
packages:
  ShalomCore:
    path: Packages/ShalomCore
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.6
targets:
  Shalom:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
          - Info.plist
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: ShalomCore
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owenisas.shalom
        PRODUCT_NAME: Shalom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 3LHSL95J9H
          CODE_SIGN_IDENTITY: "Apple Distribution: Tsz To Suen (3LHSL95J9H)"
          PROVISIONING_PROFILE_SPECIFIER: Shalom AppStore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shalom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.owenisas.shalom.auth
            CFBundleURLSchemes:
              - shalom
        ShalomAPIBaseURL: $(SHOLAM_API_BASE_URL)
        ShalomSupabaseURL: $(SHOLAM_SUPABASE_URL)
        ShalomSupabasePublishableKey: $(SHOLAM_SUPABASE_PUBLISHABLE_KEY)
        ShalomNativeSignInMode: $(SHOLAM_NATIVE_SIGN_IN_MODE)
        ShalomBillingEnabled: false
        ShalomProductIDs: $(SHOLAM_PRODUCT_IDS)
        ShalomPrivacyPolicyURL: $(SHOLAM_PRIVACY_POLICY_URL)
        ShalomSupportURL: $(SHOLAM_SUPPORT_URL)
        ShalomSupportEmail: $(SHOLAM_SUPPORT_EMAIL)
  ShalomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ShalomTests
    dependencies:
      - target: Shalom
      - package: ShalomCore
  ShalomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Shalom
schemes:
  Shalom:
    build:
      targets:
        Shalom: all
        ShalomTests: [test]
        ShalomUITests: [test]
    test:
      targets:
        - name: ShalomTests
          parallelizable: false
        - name: ShalomUITests
          parallelizable: false
